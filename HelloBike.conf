# NAME: HelloBike
# 哈啰单车净化
# 原作者：TG@ZenMoFiShi（https://github.com/ZenmoFeiShi/Qx）
# 原文件：https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/helloobike.snippet
# 本版改动：脚本地址指向自己的仓库，并走 jsDelivr CDN
#
# 仓库需要上传 2 个文件（都放根目录）：
#   HelloBike.conf    本文件
#   easybike-ad.js    118 KB 脚本
#
# QX 订阅地址：
#   https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/HelloBike.conf
#
# 说明：原文件是 Loon 的 .snippet 格式（#!name 那几行是 Loon 元数据），
# QX 里 # 开头一律当注释，不影响解析。规则与 hostname 均未改动。

# 净化弹窗、首页推荐流、借钱入口与会员领券横条
# 隐藏我的页推广宫格、推荐、奖励金、接单券提醒及钱包金融整排

^https?:\/\/api-htp\.beizi\.biz\/mb\/sdk0\/json(?:\?|$) url reject-200
^https?:\/\/adservice\.sigmob\.cn\/(?:hb\/v2\/ad|ad\/v4)(?:\?|$) url reject-200
^https?:\/\/tm\.sigmob\.cn\/(?:waterfall\/v1|strategy\/v6)(?:\?|$) url reject-200
^https?:\/\/(?:mi|v2mi)\.gdt\.qq\.com\/(?:gdt_mview\.fcg|server_bidding2)(?:\?|$) url reject-200
^https:\/\/resource\.51downapp\.cn\/f414fbc17c411b4e986ba8891c738a49\.json\?(?:[^#]*&)?md5=e5230c919f7e3f3af3256161fbfaa0e2&(?:[^#]*&)?hbe_qx_ui=1\.3$ url script-echo-response https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/easybike-ad.js
^https:\/\/api\.hellobike\.com(?::443)?\/secretkey(?:\?|$) url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/easybike-ad.js
^https?:\/\/(?:api|marketingapi|entertainment)\.hellobike\.com(?::\d+)?\/api(?:\?|$) url script-request-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/easybike-ad.js
^https?:\/\/(?:api|marketingapi|entertainment)\.hellobike\.com(?::\d+)?\/api(?:\?|$) url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/easybike-ad.js

hostname = %APPEND% api.hellobike.com, marketingapi.hellobike.com, entertainment.hellobike.com, api-htp.beizi.biz, adservice.sigmob.cn, tm.sigmob.cn, mi.gdt.qq.com, v2mi.gdt.qq.com, resource.51downapp.cn
