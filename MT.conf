# NAME: MT-Ads
# 美团 App 净化（重写部分）
# 原作者：TG@ZenMoFiShi（https://github.com/ZenmoFeiShi/Qx）
# 原文件：https://raw.githubusercontent.com/ZenmoFeiShi/Qx/refs/heads/main/MT.snippet
#
# 注意：原文件把「分流规则」和「重写规则」混在一起（Loon 语法），
# QX 无法混用，已拆成两个文件：
#   MT.conf   本文件 —— 重写规则，加到「重写 → 引用」
#   MT.list   分流规则 —— 加到「分流 → 引用」
#
# 仓库需要上传 3 个文件（都放根目录）：
#   MT.conf    本文件
#   MT.list    分流规则
#   MT.js      4.6 KB 脚本
#
# QX 订阅地址：
#   重写：https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.conf
#   分流：https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.list

hostname = %APPEND% apimobile.meituan.com, feedguess.meituan.com, mop.meituan.com, mt-personalcenter.meituan.com, assistify.meituan.com, httpdns.meituan.com, httpdnsmultiapi.meituan.com


# > HTTPDNS 接口
^https?:\/\/(httpdns|httpdnsvip|httpdnsmultiapi|httpdnsmultiapivip)\.meituan\.com\/ url reject
# > IP 直连兜底
^http:\/\/103\.37\.155\.60\/fetch url reject
# > 首页 Tab（隐藏 video / xiaotuan）
^https?:\/\/apimobile\.meituan\.com\/aggroup\/indexTab url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 首页推荐流
^https?:\/\/feedguess\.meituan\.com\/lycoris\/scene\/(gwc_feed1_2265|personalcenter_2154)(\?|$) url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 我的页面
^https?:\/\/mt-personalcenter\.meituan\.com\/usercenter\/display url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 搜索默认词
^https?:\/\/apimobile\.meituan\.com\/group\/v1\/deal\/searchpage\/defaultword url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 搜索热词
^https?:\/\/apimobile\.meituan\.com\/group\/v1\/deal\/searchpage\/hotword\/city\/divide\/hotrecommend\/ url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 角标配置
^https?:\/\/assistify\.meituan\.com\/assistant\/getAppClientHornConfig url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 购物车入口
^https?:\/\/mop\.meituan\.com\/mop\/entry\/shoppingCartEntry url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
# > 开屏图
^https?:\/\/mop\.meituan\.com\/api\/entryModule\/startupPicture url script-response-body https://cdn.jsdelivr.net/gh/zzxyscc6699/cainiao-moyu@master/MT.js
